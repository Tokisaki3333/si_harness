[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shi-harness"
version = "0.1.0"
description = "祀的角色扮演运行时：上下文组装、压缩、长期记忆与召回"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
shi-harness = "harness.cli:main"

[tool.setuptools.packages.find]
include = ["harness*"]
